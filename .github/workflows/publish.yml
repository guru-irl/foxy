{
  "name": "Publish approved AMO releases",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "tag": {
          "description": "Tag to check, or empty for all unpublished tags",
          "required": false,
          "type": "string"
        }
      }
    },
    "schedule": [
      {
        "cron": "23 9 * * *"
      }
    ]
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "amo-releases",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "env": {
        "REQUESTED_TAG": "${{ github.event.inputs.tag || '' }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262", # v4
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", # v5
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Find unpublished tags",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PY'\nimport json, os, pathlib, re, subprocess, sys\nvalid = lambda tag: bool(re.fullmatch(r'v[0-9]+\\.[0-9]+\\.[0-9]+', tag))\ntags = subprocess.check_output(['git', 'tag', '--list', 'v*', '--sort=v:refname'], text=True).splitlines()\ntags = [tag for tag in tags if valid(tag)]\nrequested = os.environ.get('REQUESTED_TAG', '')\nif requested and (not valid(requested) or requested not in tags):\n    sys.exit('Unknown or invalid release tag')\npages = json.loads(subprocess.check_output(['gh', 'api',\n    'repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases?per_page=100', '--paginate', '--slurp'], text=True))\nreleases = {release['tag_name']: release for page in pages for release in page}\ncandidates = [{'tag': tag, 'draft': tag in releases} for tag in tags\n              if (requested == tag) or (not requested and tag in releases and releases[tag]['draft'])]\npublished = [tag for tag, release in releases.items() if not release['draft'] and valid(tag)]\npathlib.Path('candidates.json').write_text(json.dumps({'candidates': candidates, 'published': published}))\nPY"
        },
        {
          "name": "Fetch approved AMO files",
          "run": "python3 - <<'PY'\nimport json, pathlib, subprocess, sys\ncandidates = json.loads(pathlib.Path('candidates.json').read_text())\napproved = []\nfor candidate in candidates['candidates']:\n    version = candidate['tag'][1:]\n    status_path = pathlib.Path(f'dist/foxy-{version}-status.json')\n    status_path.unlink(missing_ok=True)\n    result = subprocess.run(['python3', 'scripts/sign.py', '--fetch-only', '--channel', 'listed',\n                             '--version', version, '--wait', '0'])\n    if not status_path.exists():\n        sys.exit(f\"{candidate['tag']}: AMO lookup failed\")\n    status = json.loads(status_path.read_text())\n    if status['status'] == 'rejected':\n        print(f\"{candidate['tag']}: AMO rejected the version; skipping\")\n        continue\n    result.check_returncode()\n    if status['status'] == 'signed':\n        approved.append(candidate)\n    elif status['status'] == 'pending':\n        print(f\"{candidate['tag']}: Waiting for AMO review\")\n    else:\n        sys.exit(f\"{candidate['tag']}: AMO rejected the version\")\nkey = lambda tag: tuple(map(int, tag[1:].split('.')))\nlatest = max(candidates['published'] + [item['tag'] for item in approved], key=key, default='')\nfor item in approved:\n    item['latest'] = item['tag'] == latest\npathlib.Path('approved.json').write_text(json.dumps(approved))\nPY"
        },
        {
          "name": "Publish approved versions",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PY' > approved.tsv\nimport json, pathlib\nfor item in json.loads(pathlib.Path('approved.json').read_text()):\n    print(item['tag'], str(item['draft']).lower(), str(item['latest']).lower(), sep='\\t')\nPY\nwhile IFS=$'\\t' read -r tag draft latest; do\n  export TAG=\"$tag\"\n  version=${TAG#v}\npython3 - \"$TAG\" <<'PY'\nimport json, pathlib, subprocess, sys, zipfile\nversion = sys.argv[1][1:]\nexpected = json.loads(subprocess.check_output(['git', 'show', sys.argv[1] + ':extension/manifest.json']))\nwith zipfile.ZipFile(f'dist/foxy-{version}-signed.xpi') as archive:\n    actual = json.loads(archive.read('manifest.json'))\nif actual['version'] != version or expected['version'] != version:\n    sys.exit('Signed XPI or tag manifest version does not match tag')\nif actual['browser_specific_settings']['gecko']['id'] != expected['browser_specific_settings']['gecko']['id']:\n    sys.exit('Signed XPI add-on ID does not match tag')\nPY\ncp \"dist/foxy-$version-signed.xpi\" \"foxy-$version.xpi\"\nurl=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[\"url\"])' \"dist/foxy-$version-status.json\")\npython3 scripts/update_manifest.py \"$version\" \"foxy-$version.xpi\" \"$url\"\n  python3 scripts/source_archive.py \"$TAG\"\ngit fetch --force origin \"+refs/tags/$TAG:refs/tags/$TAG\"\n: > release-notes.txt\nif [ \"$(git cat-file -t \"$TAG\")\" = tag ]; then\n  message=$(git for-each-ref --format='%(contents)' \"refs/tags/$TAG\")\n  if [ -n \"$message\" ]; then printf '%s\\n\\n' \"$message\" >> release-notes.txt; fi\nfi\nprevious=$(git describe --tags --match 'v*' --abbrev=0 \"$TAG^\" 2>/dev/null || true)\nif [ -n \"$previous\" ]; then\n  printf 'Changes since %s:\\n' \"$previous\" >> release-notes.txt\n  git log --format='- %s' \"$previous..$TAG\" >> release-notes.txt\nelse\n  printf 'Changes:\\n' >> release-notes.txt\n  git log --format='- %s' \"$TAG\" >> release-notes.txt\nfi\n  if [ \"$draft\" = true ]; then\n    gh release upload \"$TAG\" \"foxy-$version.xpi\" \"dist/foxy-$version-source.zip\" updates.json --clobber\n    gh release edit \"$TAG\" --draft=false --latest=\"$latest\" --notes-file release-notes.txt\n  else\n    gh release create \"$TAG\" \"foxy-$version.xpi\" \"dist/foxy-$version-source.zip\" updates.json --verify-tag --latest=\"$latest\" --title \"Foxy $version\" --notes-file release-notes.txt\n  fi\ndone < approved.tsv"
        }
      ]
    }
  }
}
